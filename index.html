<!DOCTYPE html>
<html lang="en">
<head>
    <title>My Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   
    <div id="city">
        <p id="title">Weather App</p>
        <input type="text" id="field" placeholder="Enter City Name">
        <button id="search" onclick="search()">Search</button>
    </div> 
     <div id="weather">
        
        <p id="app">Weather App</p><hr>
        <img src="" id="image">
        <p id="temper"></p>
        <p id="cityname"></p>

    <span id="details">
            <span id="feels">
              <span id="left">
                <img src="https://cdn-icons-png.flaticon.com/512/17500/17500661.png" alt="" id="icon">
                <p id="like"></p>
              </span>

               <span id="left">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQIg42QUZ8jqHjQthccaSynIdZfPWgMAJeSTA&s" alt="" id="icon">
                <p id="mini"></p>
              </span>
              
                <span id="left">
                 <img src="https://static.vecteezy.com/system/resources/thumbnails/075/784/589/small/bright-yellow-arrow-pointing-up-png.png" alt="" id="icon">
                 <p id="maxi"></p>
              </span>
            </span>

            <span id="details1">
              <span id="humi">
                <p id="humidity"></p>
                <img src="https://cdn-icons-png.flaticon.com/512/6393/6393221.png" alt="" id="icon">
              </span>
              
               <span id="wind">
                <p id="wind"></p>
                <img src="https://cdn-icons-png.flaticon.com/512/1247/1247767.png" alt="" id="icon">
              </span>

               <span id="cloud">
                <p id="cloud"></p>
                <img src="https://tse4.mm.bing.net/th/id/OIP.igcoQ9Vkh9jknBFeb-21ZwHaHa?rs=1&pid=ImgDetMain&o=7&rm=3" alt="" id="icon">
              </span>
              
            </span>  
    </span>
     </div>


     <script src="app.js"></script>

</body>
</html>
